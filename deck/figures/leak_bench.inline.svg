<svg xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1680 660" xmlns="http://www.w3.org/2000/svg" class="tf-figure" width="1680" height="660" style="aspect-ratio: 1680 / 660" data-viewbox="0 0 1680 660" data-min-text="28" data-slot="1680x660" preserveAspectRatio="xMinYMin meet" role="img" aria-label="Banc d'étalonnage en schéma de principe : réseau d'air comprimé, vanne, détendeur, manomètre de pression amont, tuyau souple, buse calibrée, jet critique, et caméra acoustique tenue à la main hors de l'axe, qui donne un score et des décibels mais pas de débit ; en dessous, l'étalonnage : pour chaque pression, le débit calculé à la buse est comparé au score LeakQ et aux décibels, d'où deux lois, débit en fonction du score et débit en fonction des décibels">
 <title>Banc d'étalonnage en schéma de principe : réseau d'air comprimé, vanne, détendeur, manomètre de pression amont, tuyau souple, buse calibrée, jet critique, et caméra acoustique tenue à la main hors de l'axe, qui donne un score et des décibels mais pas de débit ; en dessous, l'étalonnage : pour chaque pression, le débit calculé à la buse est comparé au score LeakQ et aux décibels, d'où deux lois, débit en fonction du score et débit en fonction des décibels</title>
