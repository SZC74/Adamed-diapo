   <text style="font-weight: 500; font-size: 28px; font-family: 'Instrument Sans', 'DejaVu Sans'; text-anchor: middle; fill: var(--muted, #56616B)" x="722" y="521">pression constante</text>
   <path d="M 0 544 L 1680 544" style="fill: none; stroke: var(--grid, #D6D3C8); stroke-width: 2"/>
   <text style="font-weight: 700; font-size: 28px; font-family: 'JetBrains Mono', monospace; letter-spacing: 1.1px; fill: var(--accent-text, #0A6B62)" x="0" y="588">ÉTALONNAGE</text>
   <text style="font-weight: 500; font-size: 28px; font-family: 'Instrument Sans', 'DejaVu Sans'; fill: var(--ink, #14202B)" x="230" y="588">pour chaque pression : débit calculé à la buse, comparé au score LeakQ et aux dB lus à la caméra</text>
